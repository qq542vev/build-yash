stages:
  - check
  - build
  - publish

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# 1. アップストリームの更新確認（スケジュール実行用）
check_upstream:
  stage: check
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
  before_script:
    - apk add --no-cache git make
  script:
    - git remote set-url origin https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    - make update
    - git push --tags origin

# 2. アーキテクチャごとの並列ビルド
build_arch:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--experimental"]
  parallel:
    matrix:
      - ARCH: ["amd64"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^2\.[0-9].*$/
    - if: $RELEASE_TAG =~ /^2\.[0-9].*$/
  before_script:
    - apk add --no-cache make git bash curl
    # ビルドスクリプトのあるブランチに切り替え
    - git fetch origin docker-build
    - git checkout docker-build
    # RELEASE_TAG が指定されている場合はそれを使用する
    - export CI_COMMIT_TAG=${RELEASE_TAG:-$CI_COMMIT_TAG}
    # QEMU (エミュレーター) のセットアップ
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
    # Buildx のセットアップ
    - docker buildx create --use
    # Ubuntu Pro トークンを含むシークレットファイルのリンク
    - ln -s "$ATTACH_YAML" attach.yaml
  script:
    # Makefile のターゲット形式 (build/TAG/ARCH) で実行
    - make "build/${CI_COMMIT_TAG}/${ARCH}"
  artifacts:
    paths:
      - "build/${CI_COMMIT_TAG}/"
    expire_in: 1 week

# 3. リリースページの作成
publish_release:
  stage: publish
  image: alpine:latest
  needs:
    - job: build_arch
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^2\.[0-9].*$/
    - if: $RELEASE_TAG =~ /^2\.[0-9].*$/
  before_script:
    - apk add --no-cache make git glab
    # ビルドスクリプトのあるブランチに切り替え
    - git fetch origin docker-build
    - git checkout docker-build
    # RELEASE_TAG が指定されている場合はそれを使用する
    - export CI_COMMIT_TAG=${RELEASE_TAG:-$CI_COMMIT_TAG}
    - export GITLAB_TOKEN=$CI_JOB_TOKEN
  script:
    # Makefile 内の publish ターゲット (内部で glab を使用) を実行
    - make publish
